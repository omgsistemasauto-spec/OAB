async function token(){if(!auth)throw Error('Entre na sua conta para continuar.');if((auth.expires_at||0)*1000>Date.now()+60000)return auth.access_token;if(!refreshPromise){const refresh=async()=>{const saved=read('moab.auth');if(saved?.user?.id===auth.user.id&&(saved.expires_at||0)*1000>Date.now()+60000){auth=saved;return auth.access_token}const d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:auth.refresh_token}});auth={...d,expires_at:d.expires_at||Math.floor(Date.now()/1000)+d.expires_in};write('moab.auth',auth);return auth.access_token};refreshPromise=(navigator.locks?navigator.locks.request('moab-refresh',refresh):refresh()).finally(()=>refreshPromise=null)}return refreshPromise}

function aggregate(a,mode='subject'){const map=new Map();a.forEach(r=>{const key=mode==='topic'?`${r.subject}||${r.topic}`:r.subject;if(!map.has(key))map.set(key,{name:mode==='topic'?r.topic:r.subject,subject:r.subject,q:0,c:0,seconds:0});const v=map.get(key);v.q+=r.questions;v.c+=r.correct;v.seconds+=r.seconds});return [...map.values()].map(r=>({...r,p:r.q?Math.round(100*r.c/r.q):null})).sort((a,b)=>(b.p??-1)-(a.p??-1)||b.q-a.q)}

function secondsIn(a,start,end){let sum=0;for(const r of a){const ints=r.intervals?.length?r.intervals:[{start:r.started_at,end:r.ended_at}];for(const i of ints){if(i.end)sum+=Math.max(0,Math.min(+new Date(i.end),+end)-Math.max(+new Date(i.start),+start))/1000}}return Math.floor(sum)}

function trendPointDetails(b){return `<span class="trend-detail-date">${esc(trendDateLabel(b.date))}${b.record?` · Registro ${b.record} · ${esc(b.subject)}`:''}</span><div class="trend-detail-stats"><b>${fmtNum(b.p)}<small>%</small></b><span><i class="dot" style="color:var(--green)"></i> ${b.c} acertos</span><span><i class="dot" style="color:var(--red)"></i> ${b.q-b.c} erros</span><span>${b.q} questões</span></div>`}
function trendCard(){const buckets=trendData(),pts=buckets.filter(b=>b.q),q=pts.reduce((n,b)=>n+b.q,0),c=pts.reduce((n,b)=>n+b.c,0),delta=pts.length>1?pts.at(-1).p-pts[0].p:null,{start}=trendBounds(),next=trendStep(start,1,trendPeriod),canNext=next<=dayStart(new Date());return `<section class="card trend-card"><div class="trend-heading"><div><span class="eyebrow">SEU ESFORÇO GANHA FORMA</span><h2>${trendType==='bar'?'Sua evolução em barras':'Sua curva de evolução'}</h2><p>${trendPeriod==='week'?'Sua evolução dentro da semana selecionada.':'Sua evolução dentro do mês selecionado.'}</p></div><div class="trend-switch" role="group" aria-label="Período do gráfico">${Object.entries(trendOptions).map(([key,o])=>`<button data-trend-period="${key}" class="${trendPeriod===key?'on':''}" aria-pressed="${trendPeriod===key}">${o.label}</button>`).join('')}</div></div><div class="trend-calendar"><div class="trend-navigation"><button class="trend-nav-button" data-trend-move="-1" aria-label="Período anterior">‹</button><strong>${esc(trendPeriodLabel())}</strong><button class="trend-nav-button" data-trend-move="1" aria-label="Próximo período" ${canNext?'':'disabled'}>›</button></div><label for="trendDate">${trendPeriod==='week'?'Escolher um dia da semana':'Escolher um dia do mês'}</label><input id="trendDate" type="date" value="${trendAnchor}" max="${dateKey(new Date())}"></div><div class="trend-filter"><label for="trendSubject">Matéria</label><select id="trendSubject"><option value="">Todas as matérias</option>${subjectOptions(trendSubject)}</select></div><div class="trend-view-row"><span>Visualização</span><div class="trend-view-toggle" role="group" aria-label="Tipo de gráfico"><button data-trend-type="line" class="${trendType==='line'?'on':''}" aria-pressed="${trendType==='line'}">${icon('chart')} Linhas</button><button data-trend-type="bar" class="${trendType==='bar'?'on':''}" aria-pressed="${trendType==='bar'}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 16V9h3v7Zm5 0V4h3v12Zm5 0v-5h3v5Z"/></svg> Barras</button></div></div><div class="trend-overview"><div><strong>${q?fmtNum(c/q*100):'—'}${q?'<small>%</small>':''}</strong><span>de acertos ${trendPeriod==='week'?'na semana':'no mês'}</span></div>${delta!==null?`<div class="trend-change ${delta>0?'positive':delta<0?'negative':'neutral'}">${delta>0?'↗':delta<0?'↘':'→'} ${delta>0?'+':''}${fmtNum(delta)} p.p.<small>primeiro × último ${trendOptions[trendPeriod].unit} com questões</small></div>`:'<span class="muted" style="font-size:11px">'+(pts.length?'Seu primeiro ponto já está aqui.':'Um registro de cada vez.')+'</span>'}</div><div class="trend-window">${q} questões <span>· ${pts.length} ${pts.length===1?'dia com questões':'dias com questões'}</span></div>${trendPlot(buckets)}${pts.length?`<div id="trendDetails" class="trend-detail" aria-live="polite">${trendPointDetails(pts.at(-1))}</div>`:''}<p class="caption">${trendType==='bar'?'Cada barra mostra o percentual de acertos de um dia. Toque para ver acertos, erros e total de questões.':pts.length===1?'Há apenas um dia com questões neste período. A curva aparece com dois ou mais pontos.':'O gráfico aproxima os dias com questões dentro do período escolhido. Toque nos pontos para ver os resultados.'} ${trendType==='bar'?'Dias sem questões não têm barra.':'A linha conecta somente resultados registrados.'}</p></section>`}
function selectTrendPoint(index){const b=trendData()[index];if(!b||!b.q)return;const el=$('#trendDetails');if(el)el.innerHTML=trendPointDetails(b);document.querySelectorAll('[data-trend-point]').forEach(p=>p.setAttribute('aria-pressed',String(Number(p.dataset.trendPoint)===index)))}
function moveTrendPeriod(n){const {start}=trendBounds(),target=trendStep(start,n,trendPeriod);if(target>dayStart(new Date()))return;trendAnchor=dateKey(target);render()}

function home(){const name=esc((profile.name||'Estudante').split(' ')[0]),rs=done(),cd=countdown(),rank=aggregate(rs),weak=rank.filter(r=>r.q>=10).sort((a,b)=>a.p-b.p)[0];return `${heading('UM POUCO MELHOR A CADA DIA',`Vamos nessa, ${name}.`,'Sua aprovação começa no que você faz hoje.')}<section class="hero"><div class="hero-copy"><span class="pill ghost">${icon('calendar')} ${cd.days!==null&&cd.days>=0?'SUA PRÓXIMA CONQUISTA':'SEU PLANO, SEU RITMO'}</span><h2>${cd.days!==null&&cd.days>=0?`O futuro começa<br>com o foco de hoje.`:'Um passo por dia.<br>Uma grande conquista.'}</h2><p>${cd.label}</p><button class="btn white" data-nav="${active?'study':cd.days===null?'profile':'study'}">${icon(active?'play':cd.days===null?'calendar':'play')} ${active?'Retomar sessão':cd.days===null?'Definir minha prova':'Começar a estudar'} ${icon('arrow')}</button></div><div class="hero-orbit" aria-hidden="true"><div class="orbit-ring"></div><div class="orbit-center">${cd.days!==null&&cd.days>=0?`<b>${cd.days}</b><span>${cd.days===1?'DIA':'DIAS'} PARA A PROVA</span>`:`${icon('bolt')}<span>SEU PRÓXIMO NÍVEL</span>`}</div></div></section>${statsCards(rs)}${trendCard()}<div class="grid">${weekCard()}<section class="card"><div class="cardtitle"><h2>Seu próximo foco</h2><button class="textbtn" data-nav="progress">Ver desempenho ${icon('arrow')}</button></div><div class="insight">${icon('bolt')}<div><h3>${weak?esc(weak.name):'Pequenos passos, todos os dias'}</h3><p>${weak?`${weak.p}% de acertos em ${weak.q} questões. Reserve um tempo para revisar os pontos que precisam de atenção.`:'Registre seus resultados e descubra quais matérias merecem uma revisão.'}</p></div></div><button class="textbtn" data-nav="questions">Registrar questões ${icon('arrow')}</button></section></div><section class="card" style="margin-top:20px"><div class="cardtitle"><h2>Últimos registros</h2><button class="textbtn" data-nav="history">Histórico ${icon('arrow')}</button></div>${rs.length?rs.slice(0,3).map(sessionRow).join(''):empty('Sua primeira sessão te espera','Escolha uma matéria, dê o check-in e comece.',`<button class="btn light" data-nav="study">Começar agora ${icon('arrow')}</button>`)}</section>`}
function subjectOptions(selected=''){return Object.keys(SUBJECTS).map(s=>`<option ${s===selected?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}
function study(){if(finishMode)return checkout();if(active){const running=isRunning(active);return `${heading('CHECK-IN','Você está no caminho.','Uma sessão de cada vez. Uma conquista lá na frente.')}<div class="study-layout"><section class="timer-card"><span class="pill ${running?'':'warn'}"><span class="dot"></span>${running?'SESSÃO EM ANDAMENTO':'SESSÃO PAUSADA'}</span><div class="timer-ring ${running?'running':''}"><div class="timer-value" id="timer">${clock(elapsed(active))}</div><small>tempo de estudo</small></div><h2>${esc(active.subject)}</h2><p class="muted" style="margin:7px 0 25px">${esc(active.topic)}</p><div class="timer-actions"><button class="btn light" data-action="pause">${icon(running?'pause':'play')}${running?'Pausar':'Continuar'}</button><button class="btn" data-action="checkout">${icon('check')}Finalizar</button></div><button class="textbtn muted" style="font-size:11px;margin-top:15px" data-action="discard">Descartar sessão</button></section><div class="stack"><section class="card"><span class="eyebrow">SEU CHECK-IN</span><h2 style="margin:10px 0 20px">Foco no que importa.</h2><div class="row between"><span class="muted">Início</span><b>${dateShort(active.started_at)} às ${timeShort(active.started_at)}</b></div><div class="row between" style="margin-top:15px"><span class="muted">Matéria</span><b style="text-align:right;font-size:12px">${esc(active.subject)}</b></div><div class="tip">${icon('clock')}<span>O tempo continua mesmo com a tela bloqueada. Ao fazer uma pausa, use o botão Pausar.</span></div></section><section class="card"><span class="eyebrow">LEMBRETE GENTIL</span><h2 style="font-size:25px;margin:12px 0">Presença vale<br>mais que pressa.</h2><p class="muted">Seu check-in acompanha o tempo. Você pode registrar acertos e erros na aba Questões quando quiser.</p></section></div></div>`}return `${heading('CHECK-IN','Hora de dar o próximo passo.','Escolha o que estudar. A gente cuida do tempo.')}<div class="study-layout"><section class="card"><div class="row"><div class="circle">${icon('book')}</div><div><h2>Seu check-in</h2><small>Prepare sua próxima sessão</small></div></div><form id="startForm"><label for="subject">Qual matéria vamos estudar?</label><select id="subject" name="subject">${subjectOptions()}</select><label for="topic">Tema da sessão</label><input id="topic" name="topic" placeholder="Ex.: Estatuto da Advocacia" list="topics" required maxlength="120" autocomplete="off"><datalist id="topics">${SUBJECTS[Object.keys(SUBJECTS)[0]].map(t=>`<option value="${esc(t)}">`).join('')}</datalist><p class="caption">Escolha uma sugestão ou escreva seu próprio tema.</p><label for="notes">Uma intenção para hoje <span class="muted">(opcional)</span></label><textarea id="notes" name="notes" placeholder="Ex.: revisar os pontos que errei ontem" maxlength="1000" rows="3"></textarea><button class="btn wide" type="submit" style="margin-top:24px">${icon('play')} Fazer check-in e começar</button></form></section><section class="timer-card"><span class="eyebrow">SEU MOMENTO DE FOCO</span><div class="timer-ring"><div class="timer-value">00:00:00</div><small>Pronto quando você estiver</small></div><h2>O primeiro passo conta.</h2><p class="muted" style="font-size:12px;margin:10px auto;max-width:250px">Comece com o tempo que você tem. A consistência vem depois.</p><div class="tip">${icon('check')}<span>Aqui você registra apenas seu tempo de estudo. Os resultados ficam na aba Questões, independente do check-in.</span></div></section></div>`}
function checkout(){return `${heading('CHECK-OUT','Tempo bem investido.','Encerre seu estudo e guarde mais um passo da jornada.')}<section class="card profile-card"><div class="row between"><div><span class="eyebrow">RESUMO DO CHECK-IN</span><h2 style="margin-top:8px">${esc(active.subject)}</h2><p class="muted">${esc(active.topic)}</p></div><div class="circle">${icon('clock')}</div></div><div class="summary-strip"><div><strong>${duration(elapsed(active))}</strong><small>TEMPO ESTUDADO</small></div><div><strong>${timeShort(active.started_at)}</strong><small>CHECK-IN</small></div><div><strong>${timeShort(active.intervals.at(-1)?.end||Date.now())}</strong><small>FIM DO FOCO</small></div></div><form id="finishForm"><label for="finishNotes">Anotações do estudo <span class="muted">(opcional)</span></label><textarea id="finishNotes" name="notes" rows="3" maxlength="1000" placeholder="O que você estudou hoje?">${esc(active.notes||'')}</textarea><button class="btn wide" type="submit" style="margin-top:22px">Salvar meu check-out ${icon('check')}</button><button type="button" class="textbtn wide" style="width:100%;justify-content:center;margin-top:10px" data-action="back-timer">Voltar ao cronômetro</button></form><div class="tip">${icon('check')}<span>Resolveu exercícios? Registre os resultados separadamente na aba <b>Questões</b>.</span></div></section>`}
async function saveRow(r){if(demo){const i=rows.findIndex(x=>x.id===r.id);if(i<0)rows.push(r);else rows[i]=r;cache();return r}if(syncError)throw Error('Reconecte sua conta antes de registrar a sessão.');const isNew=!rows.some(x=>x.id===r.id),payload={...r,user_id:auth.user.id};const out=await db(isNew?'oab_sessions?on_conflict=id':`oab_sessions?id=eq.${r.id}&user_id=eq.${auth.user.id}&status=eq.active`,{method:isNew?'POST':'PATCH',body:payload,headers:{Prefer:isNew?'resolution=ignore-duplicates,return=representation':'return=representation'}});if(!out?.length){const current=await db(`oab_sessions?id=eq.${r.id}&user_id=eq.${auth.user.id}&select=*`);if(r.status==='completed'&&current[0]?.status==='completed'){const i=rows.findIndex(x=>x.id===r.id);if(i>=0)rows[i]=current[0];else rows.push(current[0]);cache();return current[0]}throw Error('Esta sessão foi alterada em outro dispositivo. Atualize para continuar.');}const i=rows.findIndex(x=>x.id===r.id);if(i<0)rows.push(out[0]);else rows[i]=out[0];cache();return out[0]}
async function startSession(e){e.preventDefault();const f=new FormData(e.currentTarget),subject=f.get('subject'),topic=f.get('topic').trim(),notes=f.get('notes').trim();if(!topic){toast('Informe o tema da sessão.');return}await guarded(async()=>{if(active)throw Error('Você já tem uma sessão em andamento.');if(!demo){await load();if(active){render();throw Error('Encontramos uma sessão aberta. Você pode retomá-la.')}}const now=new Date().toISOString(),r={id:crypto.randomUUID(),subject,topic,notes,started_at:now,ended_at:null,seconds:0,questions:0,correct:0,intervals:[{start:now,end:null}],status:'active'};active=await saveRow(r);finishMode=false;render();toast('Check-in feito. Bom estudo!')},e.currentTarget.querySelector('[type=submit]'))}
async function pauseSession(forCheckout=false){if(!active)return;const updated=structuredClone(active),running=isRunning(updated),now=new Date().toISOString();if(running)updated.intervals.at(-1).end=now;else if(!forCheckout)updated.intervals.push({start:now,end:null});updated.seconds=elapsed(updated);active=await saveRow(updated);if(forCheckout)finishMode=true;render()}
async function finishSession(e){e.preventDefault();const f=new FormData(e.currentTarget);await guarded(async()=>{const r={...structuredClone(active),status:'completed',ended_at:new Date().toISOString(),seconds:elapsed(active),questions:0,correct:0,notes:f.get('notes').trim()};const saved=await saveRow(r);active=null;finishMode=false;page='study';render();showSuccess(saved)},e.currentTarget.querySelector('[type=submit]'))}
function showSuccess(r){modal(`<div class="circle" style="width:62px;height:62px;margin:auto">${icon('check')}</div><h2>Check-out salvo.</h2><p>${duration(r.seconds)} de dedicação adicionados à sua jornada. Seu tempo já aparece nas metas e nos gráficos.</p><button class="btn wide" data-action="success-questions">Registrar acertos e erros ${icon('arrow')}</button><button class="textbtn wide" style="justify-content:center;width:100%" data-action="close-modal">Agora não</button>`,true)}

function getQuestionDraft(){const key=dataKey()+'.questions-draft';if(!questionDraft||questionDraft.owner!==key){const old=read(key,{});questionDraft={id:crypto.randomUUID(),subject:Object.keys(SUBJECTS)[0],topic:'',correct:'',wrong:'',date:dateKey(new Date()),notes:'',...old,owner:key}}return questionDraft}
function rememberQuestions(){const f=$('#questionForm');if(!f)return;const values=new FormData(f),d=getQuestionDraft();if(d.pending)return;for(const key of ['subject','topic','correct','wrong','date','notes'])d[key]=values.get(key);write(d.owner,d)}
function questionPage(){const d=getQuestionDraft(),recent=done().filter(r=>r.questions>0).slice(0,4);return `${heading('QUESTÕES','Cada resposta ensina.','Registre seus acertos e erros, com ou sem check-in.')}<div class="study-layout"><section class="card"><div class="row"><div class="circle">${icon('check')}</div><div><h2>Novo resultado</h2><small>Um registro independente do cronômetro</small></div></div><form id="questionForm">${d.pending?'<div class="tip">O envio anterior ainda não foi confirmado. Clique em Salvar resultado para tentar novamente sem duplicar o registro.</div>':''}<div class="question-date"><label for="qDate">${icon('calendar')} Data em que você resolveu as questões</label><input id="qDate" name="date" type="date" value="${esc(d.date)}" max="${dateKey(new Date())}" aria-describedby="qDateHelp" required><p id="qDateHelp">Pode ser hoje ou um dia anterior. Essa data será usada no histórico e nos gráficos.</p></div><label for="qSubject">Matéria</label><select id="qSubject" name="subject">${subjectOptions(d.subject)}</select><label for="qTopic">Tema</label><input id="qTopic" name="topic" list="qTopics" value="${esc(d.topic)}" placeholder="Ex.: Direitos fundamentais" maxlength="120" required autocomplete="off"><datalist id="qTopics">${(SUBJECTS[d.subject]||[]).map(t=>`<option value="${esc(t)}">`).join('')}</datalist><div class="formgrid"><div><label for="qCorrect">Acertos</label><input id="qCorrect" name="correct" type="number" inputmode="numeric" min="0" max="10000" step="1" value="${esc(d.correct)}" placeholder="0" required></div><div><label for="qWrong">Erros</label><input id="qWrong" name="wrong" type="number" inputmode="numeric" min="0" max="10000" step="1" value="${esc(d.wrong)}" placeholder="0" required></div></div><div class="question-totals" aria-live="polite"><div><small>TOTAL DE QUESTÕES</small><strong id="qTotal">0</strong></div><div><small>APROVEITAMENTO</small><strong id="qPct">—</strong></div></div><p class="caption">Total calculado automaticamente: acertos + erros.</p><label for="qNotes">O que revisar? <span class="muted">(opcional)</span></label><textarea id="qNotes" name="notes" maxlength="1000" rows="3" placeholder="Anote os pontos que merecem atenção">${esc(d.notes)}</textarea><button class="btn wide" type="submit" style="margin-top:24px">Salvar resultado ${icon('check')}</button></form></section><div class="stack"><section class="card"><span class="eyebrow">SEU PROGRESSO EM CADA RESPOSTA</span><h2 style="margin:12px 0">Pratique. Revise. Evolua.</h2><p class="muted" style="font-size:12px">Registre listas de exercícios, simulados ou revisões. Seus resultados alimentam o desempenho por matéria e tema.</p>${active?`<div class="tip">${icon('clock')}<span>Seu check-in está ${isRunning(active)?'em andamento':'pausado'}. Registrar questões não altera o cronômetro.</span></div><button class="textbtn" data-nav="study">Voltar ao check-in ${icon('arrow')}</button>`:'<div class="tip">'+icon('check')+'<span>Você pode registrar questões a qualquer momento. Não precisa iniciar uma sessão de estudo.</span></div>'}</section><section class="card"><div class="cardtitle"><h2>Últimos resultados</h2><button class="textbtn" data-nav="progress">Evolução ${icon('arrow')}</button></div>${recent.length?recent.map(sessionRow).join(''):empty('Seu primeiro resultado te espera','Informe os acertos e erros para começar a acompanhar.')}</section></div></div>`}
function updateQuestionTotals(){const c=Number($('#qCorrect').value),w=Number($('#qWrong').value),valid=Number.isInteger(c)&&Number.isInteger(w)&&c>=0&&w>=0&&c+w<=10000;$('#qTotal').textContent=valid?c+w:'—';$('#qPct').textContent=valid&&c+w?Math.round(c/(c+w)*100)+'%':'—'}
async function saveQuestions(e){e.preventDefault();const form=e.currentTarget,d=getQuestionDraft();let r=d.pending;if(!r){const f=new FormData(form),rawC=f.get('correct'),rawW=f.get('wrong'),correct=Number(rawC),wrong=Number(rawW),subject=f.get('subject'),topic=(f.get('topic')||'').trim(),date=f.get('date'),notes=(f.get('notes')||'').trim();if(rawC===null||rawW===null||rawC===''||rawW===''||!Number.isInteger(correct)||!Number.isInteger(wrong)||correct<0||wrong<0||correct+wrong<1||correct+wrong>10000){toast('Informe acertos e erros inteiros. O total deve ser de 1 a 10.000 questões.');return}if(!SUBJECTS[subject]||!topic){toast('Informe a matéria e o tema.');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>dateKey(new Date())||Number.isNaN(+new Date(date+'T12:00:00'))){toast('Escolha uma data válida, até hoje.');return}rememberQuestions();const when=date===dateKey(new Date())?new Date().toISOString():new Date(date+'T12:00:00').toISOString();r={id:d.id,subject,topic,notes,started_at:when,ended_at:when,seconds:0,questions:correct+wrong,correct,intervals:[],status:'completed'};d.pending=r;write(d.owner,d)}await guarded(async()=>{const saved=await saveRow(r);try{localStorage.removeItem(d.owner)}catch{}questionDraft=null;page='questions';render();toast(`Resultado de ${new Date(saved.started_at).toLocaleDateString('pt-BR')} salvo: ${saved.correct} acertos e ${saved.questions-saved.correct} erros.`)},form.querySelector('[type=submit]'));if(questionDraft?.pending&&page==='questions')render()}

function lineChart(rs){const sorted=[...rs].sort((a,b)=>new Date(a.started_at)-new Date(b.started_at)),groups=new Map();let q=0,c=0;for(const r of sorted){q+=r.questions;c+=r.correct;if(q)groups.set(dateKey(r.started_at),{date:dayStart(r.started_at),p:100*c/q,q,c})}const vals=[...groups.values()];if(!vals.length)return empty('Seu gráfico começa na primeira questão','Use a aba Questões para registrar seus acertos e erros.');const w=560,h=190,left=34,right=14,top=16,bottom=30,min=+vals[0].date,now=+dayStart(new Date()),exam=profile.exam_date?+new Date(profile.exam_date+'T00:00:00'):now,max=Math.max(min+86400000,now,exam),x=d=>left+(+d-min)/(max-min)*(w-left-right),y=p=>top+(100-p)/100*(h-top-bottom);const pts=vals.map(v=>`${x(v.date)},${y(v.p)}`).join(' '),last=vals.at(-1),ticks=[min,min+(max-min)/2,max];return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Evolução acumulada de acertos. Início ${Math.round(vals[0].p)} por cento. Atual ${Math.round(last.p)} por cento, em ${q} questões. A parte futura fica em branco.">${[0,50,100].map(n=>`<line x1="${left}" x2="${w-right}" y1="${y(n)}" y2="${y(n)}" stroke="#eee8f3" ${n===50?'stroke-dasharray="4 4"':''}/><text x="2" y="${y(n)+4}">${n}%</text>`).join('')}<defs><linearGradient id="linefill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#820ad1" stop-opacity=".14"/><stop offset="100%" stop-color="#820ad1" stop-opacity="0"/></linearGradient></defs>${vals.length>1?`<polygon points="${x(vals[0].date)},${y(0)} ${pts} ${x(last.date)},${y(0)}" fill="url(#linefill)"/>`:''}<polyline points="${pts}" fill="none" stroke="#820ad1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${vals.map(v=>`<circle cx="${x(v.date)}" cy="${y(v.p)}" r="${vals.length>15?2:3.5}" fill="#820ad1"><title>${dateShort(v.date)}: ${Math.round(v.p)}% (${v.c}/${v.q} acumulados)</title></circle>`).join('')}${exam>now?`<line x1="${x(exam)}" x2="${x(exam)}" y1="${top}" y2="${y(0)}" stroke="#c9a5e3" stroke-dasharray="4 4"/>`:''}${ticks.map((t,i)=>`<text x="${x(t)}" y="${h-7}" text-anchor="${i===0?'start':i===2?'end':'middle'}">${i===2&&exam>now?'Prova · ':''}${dateShort(t)}</text>`).join('')}</svg><div class="legend"><span><i></i>Acertos acumulados no período</span></div><p class="caption">O espaço até a prova será preenchido com seus próximos estudos. Não é uma previsão de aprovação.</p>`}
function progressPage(){const rs=filtered(),rank=aggregate(rs,rankMode),valid=rank.filter(r=>r.q>=10),best=valid[0],worst=valid.at(-1),p=pct(rs);return `${heading('ENXERGUE O QUANTO VOCÊ CRESCEU','Seu esforço, em perspectiva.','Mais clareza para decidir o que estudar a seguir.')}<div class="chipset" aria-label="Período">${[[7,'7 dias'],[30,'30 dias'],[0,'Toda a jornada']].map(([n,t])=>`<button class="chip ${range===n?'on':''}" data-range="${n}" aria-pressed="${range===n}">${t}</button>`).join('')}</div><section class="card"><div class="cardtitle"><div><h2>Sua evolução</h2><p class="caption" style="margin-top:4px">Aproveitamento das questões respondidas</p></div><span class="pill">${p===null?'Sem questões':p+'% de acertos'}</span></div>${lineChart(rs)}</section><div class="stats"><div class="stat"><div class="row">${icon('clock')}Tempo no período</div><strong>${fmtNum(total(rs,'seconds')/3600)}<span class="unit">h</span></strong><small>${rs.filter(r=>!questionOnly(r)).length} check-ins finalizados</small></div><div class="stat"><div class="row">${icon('check')}Acertos</div><strong>${total(rs,'correct')}</strong><small>de ${total(rs,'questions')} questões</small></div><div class="stat"><div class="row">${icon('target')}Para revisar</div><strong>${total(rs,'questions')-total(rs,'correct')}</strong><small>questões com erro</small></div></div><div class="grid"><section class="card"><div class="cardtitle"><h2>Seus pontos de atenção</h2></div><div class="tabs" style="margin:0 0 12px"><button class="${rankMode==='subject'?'on':''}" data-rank="subject">Matérias</button><button class="${rankMode==='topic'?'on':''}" data-rank="topic">Temas</button></div>${rank.length?subjectRows(rank):empty('Ainda sem registros','Suas matérias e temas vão aparecer aqui.')}</section><div class="stack"><section class="card"><span class="pill good">${icon('star')} SEU DESTAQUE</span><h2 style="margin:16px 0 7px">${best?esc(best.name):'Todo começo importa.'}</h2><p class="muted" style="font-size:12px">${best?`${best.p}% de acertos em ${best.q} questões. Continue fortalecendo essa base.`:'Com pelo menos 10 questões por matéria ou tema, mostramos seus destaques.'}</p>${worst&&valid.length>1?`<div class="insight">${icon('target')}<div><h3>Vale uma revisão</h3><p>${esc(worst.name)} · ${worst.p}% em ${worst.q} questões.</p></div></div>`:''}<p class="caption">Comparações por percentual de acertos. A quantidade de questões ajuda a dar contexto.</p></section>${weekCard()}</div></div>`}
function historyPage(){const rs=done().filter(r=>(!histSubject||r.subject===histSubject)&&(histRange==='all'||new Date(r.started_at)>=plusDays(dayStart(new Date()),1-Number(histRange))));return `${heading('SEU CAMINHO ATÉ AQUI','Cada estudo deixa uma marca.','Seus check-ins e resultados, em um só lugar.',`<button class="btn outline" data-action="export">${icon('download')} Exportar CSV</button>`)}<div class="history-filters"><select id="histSubject" aria-label="Filtrar matéria"><option value="">Todas as matérias</option>${subjectOptions(histSubject)}</select><select id="histRange" aria-label="Filtrar período">${[['all','Toda a jornada'],['7','Últimos 7 dias'],['30','Últimos 30 dias']].map(([v,t])=>`<option value="${v}" ${histRange===v?'selected':''}>${t}</option>`).join('')}</select></div><section class="card"><div class="cardtitle"><h2>${rs.length} ${rs.length===1?'registro':'registros'}</h2><button class="textbtn" data-action="export" aria-label="Exportar histórico em CSV">${icon('download')}</button></div>${rs.length?rs.map(r=>`<button class="session-button" data-detail="${esc(r.id)}">${sessionRow(r)}</button>`).join(''):empty('Nenhum registro neste filtro','Seus próximos estudos vão aparecer aqui.')}</section>`}
function profilePage(){return `${heading('DO SEU JEITO','Seu plano começa com você.','Ajuste suas metas para caberem na sua rotina.')}<section class="card profile-card"><div class="profile-head"><div class="circle avatar">${esc(initials(profile.name))}</div><h2>${esc(profile.name||'Estudante')}</h2><small>${demo?'Conta de demonstração':esc(auth.user.email)}</small></div><form id="profileForm"><label for="profileName">Seu nome</label><input id="profileName" name="name" value="${esc(profile.name)}" maxlength="80" required autocomplete="given-name"><label for="examDate">Data da sua prova</label><input id="examDate" name="exam_date" type="date" value="${esc(profile.exam_date||'')}"><p class="caption">Use a data do seu exame. Você pode alterá-la quando quiser.</p><label for="weeklyGoal">Meta de estudo por semana (horas)</label><input id="weeklyGoal" name="weekly_goal" type="number" min="0.5" max="100" step="0.5" value="${profile.weekly_goal}" required><div class="tip">${icon('target')}<span>Comece com uma meta possível. O melhor plano é aquele que você consegue manter.</span></div><button class="btn wide" style="margin-top:23px" type="submit">Salvar meu plano ${icon('check')}</button></form><button class="btn outline wide" style="margin-top:12px" data-action="logout">${icon('exit')}${demo?'Sair da demonstração':'Sair da conta'}</button></section>`}
function render(){if(!auth&&!demo){renderAuth();return}shell(({home,study,questions:questionPage,progress:progressPage,history:historyPage,profile:profilePage})[page]());if(page==='home'){$('#trendSubject').onchange=e=>{trendSubject=e.target.value;render()};$('#trendDate').onchange=e=>{const v=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<=dateKey(new Date()))trendAnchor=v;render()};}if(page==='study'){if($('#startForm')){$('#startForm').onsubmit=startSession;$('#subject').onchange=()=>{$('#topic').value='';$('#topics').innerHTML=SUBJECTS[$('#subject').value].map(t=>`<option value="${esc(t)}">`).join('')}}if($('#finishForm'))$('#finishForm').onsubmit=finishSession;}if(page==='questions'){$('#questionForm').onsubmit=saveQuestions;$('#questionForm').oninput=()=>{rememberQuestions();updateQuestionTotals()};$('#qSubject').onchange=()=>{$('#qTopic').value='';$('#qTopics').innerHTML=(SUBJECTS[$('#qSubject').value]||[]).map(t=>`<option value="${esc(t)}">`).join('');rememberQuestions()};updateQuestionTotals();if(getQuestionDraft().pending)$('#questionForm').querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true)}if(page==='history'){$('#histSubject').onchange=e=>{histSubject=e.target.value;render()};$('#histRange').onchange=e=>{histRange=e.target.value;render()}}if(page==='profile')$('#profileForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),name=f.get('name').trim(),goal=Number(f.get('weekly_goal')),date=f.get('exam_date')||null;if(!name||!Number.isFinite(goal)||goal<.5||goal>100||goal*2%1){toast('Confira o nome e a meta semanal.');return}await guarded(async()=>{const p={name,exam_date:date,weekly_goal:goal};if(!demo)await db('oab_profiles?on_conflict=id',{method:'POST',body:{id:auth.user.id,...p},headers:{Prefer:'resolution=merge-duplicates,return=representation'}});profile={...profile,...p};cache();render();toast('Plano atualizado. Vamos em frente!')},e.currentTarget.querySelector('[type=submit]'))}}
let lastFocus=null;
function modal(html,center=false){lastFocus=document.activeElement;const el=document.createElement('div');el.className='modalback';el.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="Detalhes" ${center?'style="text-align:center"':''}><button class="circle" style="margin-left:auto;width:32px;height:32px" data-action="close-modal" aria-label="Fechar">${icon('close')}</button>${html}</section>`;document.body.append(el);el.querySelector('button').focus();el.onclick=e=>{if(e.target===el)closeModal()};el.onkeydown=e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusable=[...el.querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}
function closeModal(){$('.modalback')?.remove();lastFocus?.focus()}
function detail(id){const r=rows.find(r=>r.id===id);if(!r)return;modal(`<span class="eyebrow">${recordType(r)} · ${new Date(r.started_at).toLocaleDateString('pt-BR')}</span><h2>${esc(r.subject)}</h2><p>${esc(r.topic)}${questionOnly(r)?'':`<br>${duration(r.seconds)} de estudo · ${timeShort(r.started_at)} às ${timeShort(r.ended_at)}`}</p>${r.questions?`<div class="summary-strip"><div><strong>${r.questions}</strong><small>QUESTÕES</small></div><div><strong class="correct">${r.correct}</strong><small>ACERTOS</small></div><div><strong class="wrong">${r.questions-r.correct}</strong><small>ERROS</small></div></div>`:''}${r.notes?`<h3>Suas anotações</h3><p style="white-space:pre-wrap;margin-top:9px">${esc(r.notes)}</p>`:''}<button class="btn light wide" data-action="close-modal">Voltar ao histórico</button>`)}
function exportCSV(){const rs=done().filter(r=>(!histSubject||r.subject===histSubject)&&(histRange==='all'||new Date(r.started_at)>=plusDays(dayStart(new Date()),1-Number(histRange))));if(!rs.length){toast('Não há registros para exportar neste filtro.');return}const cell=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const csv=[['Tipo','Início','Fim','Matéria','Tema','Minutos','Questões','Acertos','Erros','Aproveitamento (%)','Anotações'],...rs.map(r=>[recordType(r),new Date(r.started_at).toLocaleString('pt-BR'),new Date(r.ended_at).toLocaleString('pt-BR'),r.subject,r.topic,(r.seconds/60).toFixed(1),r.questions,r.correct,r.questions-r.correct,r.questions?Math.round(r.correct/r.questions*100):'',r.notes])].map(r=>r.map(cell).join(';')).join('\r\n');const u=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='minha-oab-historico.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Histórico exportado.')}
async function logout(){if(active){modal(`<h2>Você tem uma sessão aberta.</h2><p>Finalize ou descarte a sessão antes de sair para manter seu tempo de estudo organizado.</p><button class="btn wide" data-action="go-active">Voltar à sessão</button>`);return}if(!demo&&auth){try{await request('/auth/v1/logout',{method:'POST',token:await token()})}catch{}}if(!demo)try{localStorage.removeItem(dataKey());localStorage.removeItem('moab.auth')}catch{}try{sessionStorage.removeItem('moab.demo')}catch{}auth=null;demo=false;rows=[];profile={};active=null;syncError='';page='home';authTab='login';render()}
document.addEventListener('click',async e=>{const point=e.target.closest('[data-trend-point]');if(point){selectTrendPoint(Number(point.dataset.trendPoint));return}const el=e.target.closest('button');if(!el)return;if(el.dataset.trendType){if(['line','bar'].includes(el.dataset.trendType)){trendType=el.dataset.trendType;render()}return}if(el.dataset.trendMove){moveTrendPeriod(Number(el.dataset.trendMove));return}if(el.dataset.trendPeriod){if(trendOptions[el.dataset.trendPeriod]){trendPeriod=el.dataset.trendPeriod;render()}return}if(el.dataset.nav){navigate(el.dataset.nav);return}if(el.dataset.range!==undefined){range=Number(el.dataset.range);render();return}if(el.dataset.rank){rankMode=el.dataset.rank;render();return}if(el.dataset.detail){detail(el.dataset.detail);return}const a=el.dataset.action;if(!a)return;if(a==='login-tab'||a==='signup-tab'){authTab=a==='login-tab'?'login':'signup';renderAuth()}if(a==='show-password'){const p=$('#password');p.type=p.type==='password'?'text':'password';el.setAttribute('aria-label',p.type==='password'?'Mostrar senha':'Ocultar senha')}if(a==='demo'){auth=null;demo=true;try{sessionStorage.setItem('moab.demo','1')}catch{}page='home';syncError='';demoData();render()}if(a==='logout')await guarded(logout,el);if(a==='pause')await guarded(()=>pauseSession(),el);if(a==='checkout')await guarded(()=>pauseSession(true),el);if(a==='back-timer'){finishMode=false;render()}if(a==='reload')await guarded(async()=>{await load();render();toast('Tudo atualizado.')},el);if(a==='export')exportCSV();if(a==='close-modal')closeModal();if(a==='success-questions'){closeModal();questionDraft=null;navigate('questions')}if(a==='success-progress'){closeModal();navigate('progress')}if(a==='go-active'){closeModal();finishMode=false;navigate('study')}if(a==='discard')modal('<h2>Descartar esta sessão?</h2><p>Este tempo não entrará no seu histórico. Você pode começar uma nova sessão depois.</p><button class="btn danger wide" data-action="confirm-discard">Sim, descartar</button><button class="btn outline wide" data-action="close-modal">Continuar estudando</button>');if(a==='confirm-discard')await guarded(async()=>{if(!demo)await db(`oab_sessions?id=eq.${active.id}&user_id=eq.${auth.user.id}&status=eq.active`,{method:'DELETE'});rows=rows.filter(r=>r.id!==active.id);active=null;finishMode=false;cache();closeModal();render();toast('Sessão descartada.')},el)});
setInterval(()=>{if(active&&$('#timer'))$('#timer').textContent=clock(elapsed(active))},1000);
window.addEventListener('storage',e=>{if(e.key==='moab.auth'&&!demo&&!read('moab.auth')){auth=null;active=null;rows=[];render()}if(e.key===dataKey()&&demo&&!finishMode){const d=read(dataKey());if(d){rows=d.rows;profile=d.profile;active=rows.find(r=>r.status==='active')||null;if(page!=='questions')render()}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&auth&&!demo&&!busy&&!finishMode&&!(page==='study'&&!active)&&page!=='profile'&&page!=='questions'){load().then(render).catch(()=>{render()})}});
(async function boot(){try{if(!auth&&sessionStorage.getItem('moab.demo')==='1'){demo=true;demoData();if(active)page='study';render();return}}catch{}if(auth){const c=read(dataKey());if(c){profile=c.profile;rows=c.rows;active=rows.find(r=>r.status==='active')||null}else profile={...profileDefault,name:auth.user?.user_metadata?.name||'Estudante'};app.innerHTML='<div class="loader"><div class="brand"><div class="brandmark">'+icon('book')+'</div>Minha OAB</div></div>';try{await load()}catch{}render()}else renderAuth()})();

document.addEventListener('keydown',e=>{const p=e.target.closest('[data-trend-point]');if(p&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectTrendPoint(Number(p.dataset.trendPoint))}});
</script></body></html>
